<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trax Tap Coin</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body {
    background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
    color: white;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .header {
    text-align: center;
    margin-bottom: 30px;
  }
  .header h1 {
    font-size: 24px;
    color: #f0b90b;
    margin-bottom: 5px;
  }
  .header p {
    font-size: 12px;
    color: #888;
  }
  .balance-box {
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 20px 40px;
    margin-bottom: 40px;
    text-align: center;
    border: 2px solid rgba(240,185,11,0.3);
  }
  .balance-label {
    font-size: 12px;
    color: #888;
    margin-bottom: 5px;
  }
  .balance {
    font-size: 42px;
    font-weight: bold;
    color: #f0b90b;
  }
  .coin-btn {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ffd700, #f0b90b, #b8860b);
    border: none;
    font-size: 80px;
    cursor: pointer;
    box-shadow: 0 8px 0 #8b6508, 0 12px 30px rgba(240,185,11,0.5);
    transition: all 0.1s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .coin-btn:active {
    transform: translateY(6px);
    box-shadow: 0 2px 0 #8b6508, 0 4px 15px rgba(240,185,11,0.5);
  }
  .tap-text {
    margin-top: 20px;
    font-size: 14px;
    color: #aaa;
    text-align: center;
  }
  .float-text {
    position: fixed;
    font-size: 28px;
    font-weight: bold;
    color: #f0b90b;
    pointer-events: none;
    animation: floatUp 1s ease-out forwards;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-100px); }
  }
</style>
</head>
<body>

  <div class="header">
    <h1>🪙 Trax Tap Coin</h1>
    <p>Tap the coin to earn</p>
  </div>

  <div class="balance-box">
    <div class="balance-label">YOUR BALANCE</div>
    <div class="balance" id="balance">0</div>
  </div>

  <button class="coin-btn" id="coinBtn">🪙</button>

  <div class="tap-text">👆 Tap the coin above</div>

<script>
  // Telegram WebApp init
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  let balance = 0;
  let tapPower = 1;
  const balanceEl = document.getElementById('balance');
  const coinBtn = document.getElementById('coinBtn');

  // Load balance from localStorage
  const saved = localStorage.getItem('trax_balance');
  if (saved) {
    balance = parseInt(saved);
    balanceEl.textContent = balance;
  }

  // Tap function
  coinBtn.addEventListener('click', (e) => {
    balance += tapPower;
    balanceEl.textContent = balance;
    localStorage.setItem('trax_balance', balance);

    // Floating text
    const float = document.createElement('div');
    float.className = 'float-text';
    float.textContent = '+' + tapPower;
    float.style.left = (e.clientX - 20) + 'px';
    float.style.top = (e.clientY - 40) + 'px';
    document.body.appendChild(float);
    setTimeout(() => float.remove(), 1000);

    // Haptic feedback
    if (tg && tg.HapticFeedback) {
      tg.HapticFeedback.impactOccurred('light');
    }
  });
</script>
</body>
</html>
